<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pingme - Chat</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; display:flex; height:100vh; background:#f0f2f5; overflow:hidden; }
#sidebar { width:280px; background: linear-gradient(180deg, #4f46e5 0%, #7c3aed 100%); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
#sidebarHeader { padding:20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.15); }
#sidebarHeader .icon { font-size:1.6rem; }
#sidebarHeader .name { font-size:1.3rem; font-weight:800; }
#searchWrap { padding:12px 16px; }
#searchBox { width:100%; padding:10px 14px; border:none; border-radius:20px; background: rgba(255,255,255,0.15); color:#fff; font-size:0.9rem; }
#searchBox::placeholder { color: rgba(255,255,255,0.7); }
#searchBox:focus { outline:none; background: rgba(255,255,255,0.25); }
#userList { flex:1; overflow-y:auto; padding: 4px 8px; }
.user-item { display:flex; align-items:center; gap:10px; padding:10px 12px; margin:2px 0; border-radius:12px; cursor:pointer; transition: background 0.15s; }
.user-item:hover { background: rgba(255,255,255,0.12); }
.user-item.active { background: rgba(255,255,255,0.25); }
.avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.9rem; color:#fff; flex-shrink:0; }
.uname { font-size:0.92rem; font-weight:600; }
#noResults { padding:1rem; color: rgba(255,255,255,0.7); font-size:0.85rem; text-align:center; }
#logout { margin:16px; padding:10px; background: rgba(255,255,255,0.15); color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer; transition: background 0.15s; }
#logout:hover { background: rgba(255,255,255,0.28); }
#main { flex:1; display:flex; flex-direction:column; background: #eef0f5; min-width:0; }
#chatHeader { padding:16px 24px; background:#fff; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:12px; font-weight:700; color:#1f2937; min-height:30px; }
#chatHeader .avatar { width:36px; height:36px; font-size:0.9rem; }
#backBtn { display:none; background:none; border:none; font-size:1.3rem; cursor:pointer; padding:0 4px; }
#emptyState { flex:1; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:1rem; flex-direction:column; gap:10px; }
#emptyState .big { font-size:3rem; }
#messages { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:60%; padding:10px 16px; font-size:0.92rem; line-height:1.4; animation: slideIn 0.2s ease; position:relative; }
@keyframes slideIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
.msg.mine { align-self:flex-end; background: linear-gradient(135deg, #4f46e5, #ec4899); color:#fff; border-radius:18px 18px 4px 18px; }
.msg.theirs { align-self:flex-start; background:#fff; color:#1f2937; border-radius:18px 18px 18px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
#inputRow { display:none; padding:16px 24px; background:#fff; border-top:1px solid #e5e7eb; align-items:center; gap:10px; }
#msgInput { flex:1; padding:12px 18px; border:1.5px solid #e5e7eb; border-radius:24px; font-size:0.92rem; }
#msgInput:focus { outline:none; border-color:#7c3aed; }
#sendBtn { width:44px; height:44px; border-radius:50%; background: linear-gradient(135deg, #4f46e5, #ec4899); color:#fff; border:none; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition: transform 0.15s; flex-shrink:0; }
#sendBtn:hover { transform: scale(1.08); }
@media (max-width: 700px) {
  #sidebar { position:fixed; width:100%; height:100%; z-index:5; transition: transform 0.25s ease; }
  #sidebar.hide { transform: translateX(-100%); }
  #main { width:100%; }
  #backBtn { display:inline-block; }
  .msg { max-width:80%; }
}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebarHeader">
    <span class="icon">&#128172;</span>
    <span class="name">Pingme</span>
  </div>
  <div id="searchWrap">
    <input id="searchBox" placeholder="Search users...">
  </div>
  <div id="userList"></div>
  <div id="noResults" style="display:block;">Type a username to search</div>
  <button id="logout">Log out</button>
</div>
<div id="main">
  <div id="chatHeader">
    <button id="backBtn">&#8592;</button>
  </div>
  <div id="emptyState">
    <div class="big">&#128172;</div>
    <div>Select a contact to start chatting</div>
  </div>
  <div id="messages" style="display:none;"></div>
  <div id="inputRow">
    <input id="msgInput" placeholder="Type a message...">
    <button id="sendBtn">&#10148;</button>
  </div>
</div>
<script>
const API_BASE = "http://3.110.218.164:8000";
const WS_BASE = "ws://3.110.218.164:8000";
const token = localStorage.getItem("token");
const myUsername = localStorage.getItem("username");
if (!token) window.location.href = "index.html";

let currentContact = null;
let allUsers = [];

const AVATAR_COLORS = ["#4f46e5","#7c3aed","#ec4899","#f59e0b","#10b981","#3b82f6","#ef4444","#14b8a6"];
function colorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), "Authorization": `Bearer ${token}` }
  });
  if (res.status === 401) {
    localStorage.clear();
    window.location.href = "index.html";
    throw new Error("Unauthorized");
  }
  return res;
}

async function loadUsers() {
  const res = await apiFetch("/users");
  allUsers = await res.json();
  renderUserList([]);
}

function renderUserList(users) {
  const list = document.getElementById("userList");
  const noResults = document.getElementById("noResults");
  list.innerHTML = "";

  if (users.length === 0) {
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  users.forEach(u => {
    const div = document.createElement("div");
    div.className = "user-item";
    if (u.username === currentContact) div.classList.add("active");
    div.innerHTML = `
      <div class="avatar" style="background:${colorFor(u.username)}">${u.username[0].toUpperCase()}</div>
      <div class="uname">${u.username}</div>
    `;
    div.onclick = () => selectContact(u.username, div);
    list.appendChild(div);
  });
}

document.getElementById("searchBox").addEventListener("input", (e) => {
  const query = e.target.value.trim().toLowerCase();
  const noResults = document.getElementById("noResults");
  if (query === "") {
    renderUserList([]);
    noResults.innerText = "Type a username to search";
    noResults.style.display = "block";
    return;
  }
  const filtered = allUsers.filter(u => u.username.toLowerCase().includes(query));
  renderUserList(filtered);
  if (filtered.length === 0) {
    noResults.innerText = "No users found";
  }
});

function showSidebar() {
  document.getElementById("sidebar").classList.remove("hide");
}
function hideSidebar() {
  document.getElementById("sidebar").classList.add("hide");
}
document.getElementById("backBtn").onclick = showSidebar;

async function selectContact(username, el) {
  currentContact = username;
  document.querySelectorAll(".user-item").forEach(e => e.classList.remove("active"));
  if (el) el.classList.add("active");

  document.getElementById("emptyState").style.display = "none";
  document.getElementById("messages").style.display = "flex";
  document.getElementById("inputRow").style.display = "flex";

  document.getElementById("chatHeader").innerHTML = `
    <button id="backBtn">&#8592;</button>
    <div class="avatar" style="background:${colorFor(username)}">${username[0].toUpperCase()}</div>
    <span>${username}</span>
  `;
  document.getElementById("backBtn").onclick = showSidebar;
  hideSidebar();

  const res = await apiFetch(`/messages/${currentContact}`);
  const messages = await res.json();
  const container = document.getElementById("messages");
  container.innerHTML = "";
  messages.forEach(m => appendMessage(m.content, m.sender_username));
}

function appendMessage(content, senderUsername) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + (senderUsername === myUsername ? "mine" : "theirs");
  div.innerText = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

document.getElementById("sendBtn").onclick = async () => {
  const input = document.getElementById("msgInput");
  const content = input.value.trim();
  if (!content || !currentContact) return;
  input.value = "";
  await apiFetch("/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ receiver_username: currentContact, content })
  });
  appendMessage(content, myUsername);
};

document.getElementById("msgInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

function connectWebSocket() {
  const ws = new WebSocket(`${WS_BASE}/ws/${myUsername}`);
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.sender === currentContact) appendMessage(data.content, data.sender);
  };
  ws.onclose = () => setTimeout(connectWebSocket, 2000);
}

document.getElementById("logout").onclick = () => {
  localStorage.clear();
  window.location.href = "index.html";
};

loadUsers();
connectWebSocket();
</script>
</body>
</html>
